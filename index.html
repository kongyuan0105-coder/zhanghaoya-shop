<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>我的商品目录</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fa;color:#30343b;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}.top{height:62px;background:#fff;border-bottom:1px solid #e6e8eb;display:flex;align-items:center;justify-content:space-between;padding:0 max(18px,calc((100% - 1120px)/2));gap:18px}.logo{font-weight:700;font-size:21px;color:#2677d8;white-space:nowrap}.toplinks{display:flex;gap:22px;color:#555;font-size:14px}.toplinks a{color:inherit;text-decoration:none}.tools{display:flex;align-items:center;gap:8px}.search{width:min(250px,28vw);padding:10px 12px;border:1px solid #dce1e8;border-radius:6px;font:inherit}.button{border:0;border-radius:6px;padding:10px 14px;background:#287de0;color:#fff;cursor:pointer;font:inherit;white-space:nowrap}.wrap{max-width:1120px;margin:20px auto;padding:0 16px}.notice,.catalog{background:#fff;border:1px solid #e2e6ec;border-radius:6px;margin-bottom:16px}.notice{padding:18px 20px;line-height:1.8}.notice h2{font-size:17px;margin:0 0 7px}.notice p{margin:0;color:#666;font-size:14px}.categories{display:flex;gap:8px;overflow:auto;padding:12px;background:#fff;border:1px solid #e2e6ec;border-radius:6px;margin-bottom:16px}.cat{border:0;border-radius:5px;padding:8px 13px;background:transparent;color:#555;cursor:pointer;white-space:nowrap;font:inherit}.cat.active{background:#eaf3ff;color:#2474d2}.catalog h2{margin:0;padding:15px 18px;border-bottom:1px solid #e8ebef;font-size:17px;font-weight:600}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:580px}th,td{text-align:left;padding:14px 18px;border-bottom:1px solid #edf0f3;font-size:14px}th{color:#777;background:#fbfcfd;font-weight:500}td.price{color:#e06447;font-weight:600;white-space:nowrap}td.stock{color:#777;width:100px}.buy{border:1px solid #287de0;background:#fff;color:#287de0;border-radius:5px;padding:6px 14px;cursor:pointer}.empty{text-align:center;color:#999;padding:45px 15px}.empty strong{display:block;color:#555;font-size:16px;margin-bottom:8px}.footer{text-align:center;color:#aaa;font-size:12px;padding:18px}dialog{border:0;border-radius:12px;width:min(440px,calc(100% - 28px));padding:23px;box-shadow:0 18px 70px #0003}dialog::backdrop{background:#0006}dialog h2{font-size:19px;margin:0 0 14px}label{display:block;font-size:13px;color:#666;margin:12px 0 6px}input,select,textarea{font:inherit}dialog input,dialog select,dialog textarea{width:100%;border:1px solid #dce1e8;border-radius:6px;padding:10px}dialog textarea{min-height:70px;resize:vertical}.formrow{display:grid;grid-template-columns:1fr 1fr;gap:12px}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.cancel{background:#fff;color:#555;border:1px solid #ddd}.mobilefoot{display:none}@media(max-width:700px){.top{padding:0 12px;gap:8px}.toplinks{display:none}.logo{font-size:18px}.search{width:34vw}.wrap{padding:0 10px;margin:12px auto}.notice{padding:14px}.categories{margin-bottom:12px}.footer{padding-bottom:75px}.mobilefoot{display:flex;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e6e8eb;justify-content:space-around;padding:10px}.mobilefoot button{background:none;border:0;color:#555;font:inherit}.mobilefoot button:first-child{color:#287de0}}
</style></head><body>
<header class="top"><div class="logo" id="shopName">我的商品目录</div><nav class="toplinks"><a href="#home">首页</a><a href="#catalog">商品目录</a><a href="#notice">公告</a></nav><div class="tools"><input id="search" class="search" placeholder="搜索商品" oninput="render()"><button class="button" onclick="document.querySelector('#addDialog').showModal()">＋ 添加商品</button></div></header>
<main class="wrap" id="home"><section class="notice" id="notice"><h2>公告</h2><p>欢迎浏览商品目录。商品详情、库存和价格请以页面展示为准；如需咨询，请联系店主。</p></section><nav id="categories" class="categories"></nav><section class="catalog" id="catalog"><h2 id="listTitle">全部商品</h2><div class="tablewrap"><table><thead><tr><th>商品名称</th><th>单价</th><th>库存</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table></div><div id="empty" class="empty"><strong>目录暂时为空</strong>店主可以点击“添加商品”创建商品条目。</div></section><div class="footer">商品信息由店主维护</div></main><nav class="mobilefoot"><button onclick="scrollTo({top:0,behavior:'smooth'})">⌂ 首页</button><button onclick="document.querySelector('#addDialog').showModal()">＋ 添加商品</button><button onclick="showCart()">🛒 购物车 <span id="cartCount">0</span></button></nav>
<dialog id="addDialog"><form id="productForm"><h2>添加商品</h2><label>商品名称 *</label><input name="name" required maxlength="100" placeholder="输入商品名称"><div class="formrow"><div><label>分类</label><input name="category" maxlength="40" placeholder="例如：日用品"></div><div><label>单价（元）*</label><input name="price" required type="number" min="0" step="0.01" placeholder="0.00"></div></div><div class="formrow"><div><label>库存</label><input name="stock" type="number" min="0" step="1" value="0"></div><div><label>图片链接（可选）</label><input name="image" type="url" placeholder="https://..."></div></div><label>商品介绍（可选）</label><textarea name="desc" maxlength="300" placeholder="填写简短介绍"></textarea><div class="actions"><button type="button" class="button cancel" onclick="document.querySelector('#addDialog').close()">取消</button><button class="button">保存商品</button></div></form></dialog>
<script>
const read=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}};let products=read('shiw_catalog_products',[]),cart=read('shiw_catalog_cart',[]),active='全部';const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function render(){let cats=['全部',...new Set(products.map(p=>p.category).filter(Boolean))];if(!cats.includes(active))active='全部';document.querySelector('#categories').innerHTML=cats.map(c=>`<button class="cat ${active===c?'active':''}" onclick="active='${esc(c)}';render()">${esc(c)}</button>`).join('');let q=document.querySelector('#search').value.trim().toLowerCase();let list=products.filter(p=>(active==='全部'||p.category===active)&&`${p.name} ${p.desc} ${p.category}`.toLowerCase().includes(q));document.querySelector('#listTitle').textContent=active==='全部'?'全部商品':active;document.querySelector('#rows').innerHTML=list.map(p=>`<tr><td><div style="display:flex;align-items:center;gap:10px">${p.image?`<img src="${esc(p.image)}" alt="" style="width:42px;height:42px;object-fit:cover;border-radius:5px" onerror="this.remove()">`:''}<span><b>${esc(p.name)}</b>${p.desc?`<br><small style="color:#999">${esc(p.desc)}</small>`:''}</span></div></td><td class="price">¥${Number(p.price).toFixed(2)}</td><td class="stock">${Number(p.stock)||0}</td><td><button class="buy" onclick="addCart('${p.id}')">加入购物车</button></td></tr>`).join('');document.querySelector('#empty').style.display=list.length?'none':'block';document.querySelector('#cartCount').textContent=cart.reduce((n,x)=>n+x.qty,0)}document.querySelector('#productForm').addEventListener('submit',e=>{e.preventDefault();let f=new FormData(e.target);products.unshift({id:crypto.randomUUID(),name:f.get('name').trim(),category:f.get('category').trim()||'未分类',price:Number(f.get('price')),stock:Number(f.get('stock'))||0,image:f.get('image').trim(),desc:f.get('desc').trim()});localStorage.setItem('shiw_catalog_products',JSON.stringify(products));e.target.reset();document.querySelector('#addDialog').close();render()});function addCart(id){let x=cart.find(v=>v.id===id);if(x)x.qty++;else cart.push({id,qty:1});localStorage.setItem('shiw_catalog_cart',JSON.stringify(cart));render()}function showCart(){if(!cart.length)return alert('购物车是空的');let entries=cart.map(x=>{let p=products.find(v=>v.id===x.id);return p?`${p.name} × ${x.qty}　¥${(p.price*x.qty).toFixed(2)}`:''}).filter(Boolean);alert('购物车\n\n'+entries.join('\n'))}render();
</script></body></html>
