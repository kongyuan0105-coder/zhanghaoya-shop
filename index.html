<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>账号鸭 · 商品目录</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f5f8;color:#30343b;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;padding-bottom:90px}header{height:78px;padding:0 28px;display:flex;align-items:center;justify-content:space-between;background:white;border-bottom:1px solid #e5e8ed}h1{margin:0;font-size:25px}.cart{border:0;background:#fff;color:#333;padding:11px;cursor:pointer;font-size:16px}.wrap{max-width:1200px;margin:14px auto;padding:0 16px}.brand{height:84px;display:flex;align-items:center;gap:18px;background:#fff;padding:12px 20px;margin:0 -16px 14px}.logo{width:64px;height:64px;border-radius:12px;background:#47c6e0;display:grid;place-items:center;font-size:41px}.brand h1{font-size:27px}.notice,.catalog{background:white;border:1px solid #e0e5ec;border-radius:6px;margin-bottom:14px}.notice h2,.catalog h2{font-size:18px;font-weight:500;margin:0;padding:16px 20px;border-bottom:1px solid #e6e9ef}.notice ul{margin:0;padding:22px 28px 22px 60px;line-height:1.8}.intro{display:flex;justify-content:space-between;align-items:center;margin:0 0 14px}.intro h2{display:none}.muted{display:none}.actions{display:flex;gap:10px;width:100%}.search{border:1px solid #dce1e8;padding:14px 16px;border-radius:7px;flex:1;font-size:15px}.addbtn{background:#438ff1;color:white;border:0;border-radius:7px;padding:11px 17px;cursor:pointer;white-space:nowrap}.grid{display:flex;flex-direction:column;gap:0}.card{background:#fff;border:1px solid #e0e5ec;border-bottom:0;padding:20px;display:flex;align-items:center;gap:14px;min-height:98px}.card:last-child{border-bottom:1px solid #e0e5ec}.photo{width:42px;height:42px;flex:none;border-radius:10px;background:#f0f2f5;display:flex;align-items:center;justify-content:center;color:#aaa;font-size:0;overflow:hidden}.photo:empty:after{content:'商品';font-size:11px}.photo img{width:100%;height:100%;object-fit:cover}.info{display:flex;align-items:center;gap:18px;flex:1;min-width:0}.name{font-size:16px;font-weight:500}.desc{font-size:13px;color:#888;margin:0}.row{display:flex;align-items:center;gap:15px}.price{font-weight:700;color:#438ff1;white-space:nowrap}.buy{border:1px solid #438ff1;color:#438ff1;background:white;border-radius:6px;padding:7px 10px;cursor:pointer;white-space:nowrap}.empty{width:100%;text-align:center;padding:65px 20px;color:#999;background:#fff;border:1px solid #e0e5ec}.empty b{display:block;color:#555;font-size:17px;margin-bottom:8px}dialog{border:0;border-radius:16px;width:min(460px,calc(100% - 30px));padding:24px;box-shadow:0 20px 80px #0003}dialog::backdrop{background:#0006}dialog h3{margin:0 0 18px}label{display:block;font-size:13px;color:#666;margin:12px 0 6px}input,textarea{font:inherit}dialog input,dialog textarea{width:100%;padding:11px;border:1px solid #ddd;border-radius:8px}dialog textarea{min-height:75px;resize:vertical}.modal-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:20px}.modal-actions button{padding:10px 16px;border-radius:8px;cursor:pointer;border:1px solid #ddd;background:white}.modal-actions .save{background:#438ff1;color:white;border-color:#438ff1}footer{position:fixed;z-index:5;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e0e5ec;display:flex;justify-content:center}footer button{flex:1;max-width:300px;background:#fff;border:0;border-right:1px solid #eee;padding:13px;color:#333;font-size:15px;cursor:pointer}footer button.active{color:#438ff1}@media(max-width:600px){header{height:64px;padding:0 16px}.wrap{margin:10px auto;padding:0 10px}.brand{margin:0 -10px 10px;height:74px;padding:10px 14px}.brand h1{font-size:20px}.logo{width:54px;height:54px;font-size:34px}.notice ul{padding:16px 20px 16px 40px;font-size:14px}.intro{display:block}.actions{margin-top:0}.search{width:100%;flex:1}.addbtn{padding:10px}.card{padding:14px 10px;gap:9px;min-height:80px}.photo{width:36px;height:36px}.info{display:block}.name{font-size:14px}.desc{margin-top:4px}.row{gap:8px}.price{font-size:13px}.buy{font-size:12px;padding:6px}.grid{display:flex}footer button{font-size:13px}}
</style></head>
<body><header><h1>账号鸭</h1><button class="cart" onclick="showCart()">🛒 购物车 <span id="cartCount">0</span></button></header>
<main class="wrap"><section class="brand"><div class="logo">🐤</div><h1>账号鸭(Zhang Hao Ya.Com)</h1></section><section class="notice"><h2>公告</h2><ul><li>欢迎光临本店，商品信息与价格请以商品详情为准。</li><li>商品由店主自行添加和维护；如有疑问，请先联系店主。</li><li>下单前请仔细确认商品内容、交付方式及售后说明。</li><li>请妥善保管账号、密码等个人信息，切勿向他人泄露。</li></ul></section><div class="intro"><div><h2>商品目录</h2><div class="muted">发现喜欢的好物</div></div><div class="actions"><input class="search" id="search" placeholder="输入关键词" oninput="render()"><button class="addbtn" onclick="document.querySelector('#addDialog').showModal()">＋ 添加商品</button></div></div><section class="catalog"><h2>商品列表</h2><section id="grid" class="grid"></section></section></main><footer><button class="active" onclick="window.scrollTo({top:0,behavior:'smooth'})">⌂　首页</button><button onclick="showCart()">▣　购物车</button><button onclick="document.querySelector('#addDialog').showModal()">＋　我的商品</button></footer>
<dialog id="addDialog"><form id="productForm"><h3>添加一件商品</h3><label>商品名称 *</label><input name="name" required maxlength="60" placeholder="例如：手作陶杯"><label>价格（元）*</label><input name="price" required type="number" min="0" step="0.01" placeholder="例如：59"><label>商品图片链接（可选）</label><input name="image" type="url" placeholder="https://..."><label>商品介绍（可选）</label><textarea name="desc" maxlength="180" placeholder="简单介绍一下这件商品"></textarea><div class="modal-actions"><button type="button" onclick="document.querySelector('#addDialog').close()">取消</button><button class="save">保存商品</button></div></form></dialog>
<script>
const get=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}};let products=get('shiw_shop_products',[]),cart=get('shiw_shop_cart',[]);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function render(){let q=document.querySelector('#search').value.toLowerCase();let list=products.filter(p=>(p.name+p.desc).toLowerCase().includes(q));document.querySelector('#grid').innerHTML=list.length?list.map(p=>`<article class="card"><div class="photo">${p.image?`<img src="${esc(p.image)}" alt="${esc(p.name)}" onerror="this.parentElement.textContent='图片暂不可用'">`:'暂无图片'}</div><div class="info"><div class="name">${esc(p.name)}</div><div class="desc">${esc(p.desc||'')}</div><div class="row"><span class="price">¥${Number(p.price).toFixed(2)}</span><button class="buy" onclick="addCart('${p.id}')">加入购物车</button></div></div></article>`).join(''):`<div class="empty"><b>${q?'没有找到相关商品':'这里还没有商品'}</b>${q?'试试其他关键词，或清除搜索。':'点击右上角“添加商品”，填写名称和价格即可上架。'}</div>`;document.querySelector('#cartCount').textContent=cart.reduce((n,x)=>n+x.qty,0)}document.querySelector('#productForm').addEventListener('submit',e=>{e.preventDefault();let f=new FormData(e.target);products.unshift({id:crypto.randomUUID(),name:f.get('name').trim(),price:Number(f.get('price')),image:f.get('image').trim(),desc:f.get('desc').trim()});localStorage.setItem('shiw_shop_products',JSON.stringify(products));e.target.reset();document.querySelector('#addDialog').close();render()});function addCart(id){let item=cart.find(x=>x.id===id);if(item)item.qty++;else cart.push({id,qty:1});localStorage.setItem('shiw_shop_cart',JSON.stringify(cart));render()}function showCart(){if(!cart.length)return alert('购物车还是空的。');let lines=cart.map(x=>{let p=products.find(y=>y.id===x.id);return p?`${p.name} × ${x.qty} — ¥${(p.price*x.qty).toFixed(2)}`:''}).filter(Boolean);let sum=cart.reduce((s,x)=>{let p=products.find(y=>y.id===x.id);return s+(p?p.price*x.qty:0)},0);alert('购物车\n\n'+lines.join('\n')+'\n\n合计：¥'+sum.toFixed(2))}render();
</script></body></html>
